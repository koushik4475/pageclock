plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def releaseKeyStorePath = System.getenv("ANDROID_KEYSTORE_PATH") ?: keystoreProperties['storeFile']
def releaseKeyStoreFile = releaseKeyStorePath ? file(releaseKeyStorePath) : null
def releaseStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: keystoreProperties['storePassword']
def releaseKeyAlias = System.getenv("ANDROID_KEY_ALIAS") ?: keystoreProperties['keyAlias']
def releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD") ?: keystoreProperties['keyPassword']
def productionReleaseSigningConfigured =
    releaseKeyStoreFile != null &&
    releaseKeyStoreFile.exists() &&
    [releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null && !it.toString().trim().isEmpty() }

android {
    namespace "com.example.pageclock"
    compileSdk 35
    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.example.pageclock"
        minSdkVersion 21
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
        multiDexEnabled true
    }

    signingConfigs {
        release {
            if (productionReleaseSigningConfigured) {
                storeFile = releaseKeyStoreFile
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            // Never silently fall back to the debug certificate for a production release.
            if (productionReleaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

// Release packaging tasks must prove that the long-lived production signing identity is configured.
tasks.register("verifyProductionReleaseSigning") {
    doLast {
        if (!productionReleaseSigningConfigured) {
            throw new GradleException(
                "Production release signing is mandatory. Configure the existing release keystore and all signing credentials; debug/unsigned release fallback is forbidden."
            )
        }
    }
}

tasks.configureEach { task ->
    def taskName = task.name.toLowerCase()
    if (task.name != "verifyProductionReleaseSigning" && taskName.contains("release")) {
        task.dependsOn("verifyProductionReleaseSigning")
    }
}

flutter {
    source '../..'
}
