name: PageClock CI / CD & Automated Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: pageclock-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify-and-web:
    name: Analyze, test and build web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation (Drift / build_runner)
        run: dart run build_runner build

      - name: Analyze Dart code
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Run Flutter tests (retry transient SQLite asset download errors only)
        shell: bash
        run: |
          set -u
          log_file="$RUNNER_TEMP/flutter-test.log"
          for attempt in 1 2 3 4; do
            echo "Flutter test attempt $attempt/4"
            if flutter test --no-pub >"$log_file" 2>&1; then
              cat "$log_file"
              exit 0
            else
              status=$?
              cat "$log_file"
            fi
            if grep -Eiq '504 Gateway Time-out|Building native assets failed|Building assets for package:sqlite3 failed|sqlite3.*(download|failed)' "$log_file"; then
              echo "Transient sqlite3 native-asset download failure detected."
            else
              echo "Flutter tests failed for a non-transient reason; not retrying."
              exit "$status"
            fi
            if [ "$attempt" -lt 4 ]; then sleep $((attempt * 10)); fi
          done
          exit 1

      - name: Build Web Application
        run: flutter build web --release --no-web-resources-cdn --no-pub

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pageclock-web
          path: build/web/
          if-no-files-found: error
          compression-level: 1

  android-apk:
    name: Build Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17 (with Gradle dependency cache)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation (Drift / build_runner)
        run: dart run build_runner build

      - name: Setup Android Keystore (if secrets provided)
        id: setup_keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            chmod 600 android/app/release.keystore
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Version-tag releases require ANDROID_KEYSTORE_BASE64."
            exit 1
          else
            echo "No release keystore configured; non-release builds use Gradle debug signing."
          fi

      - name: Build Android Release APK (retry transient SQLite asset download errors only)
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -u
          log_file="$RUNNER_TEMP/android-build.log"
          for attempt in 1 2 3 4; do
            echo "Android APK build attempt $attempt/4"
            if flutter build apk --release --target-platform=android-arm64 --build-number=${{ github.run_number }} --android-skip-build-dependency-validation --no-pub >"$log_file" 2>&1; then
              cat "$log_file"
              exit 0
            else
              status=$?
              cat "$log_file"
            fi
            if grep -Eiq '504 Gateway Time-out|Building native assets failed|Building assets for package:sqlite3 failed|sqlite3.*(download|failed)' "$log_file"; then
              echo "Transient sqlite3 native-asset download failure detected."
            else
              echo "Android build failed for a non-transient reason; not retrying."
              exit "$status"
            fi
            if [ "$attempt" -lt 4 ]; then sleep $((attempt * 10)); fi
          done
          exit 1

      - name: Secure Keystore Cleanup
        if: always()
        run: |
          rm -f android/app/release.keystore
          rm -f android/key.properties

      - name: Package Release Assets & Compute Checksum
        run: |
          APK_DIR="build/app/outputs/flutter-apk"
          VERSION_TAG="v1.0.0+${{ github.run_number }}"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then VERSION_TAG="${{ github.ref_name }}"; fi
          ASSET_NAME="PageClock-${VERSION_TAG}.apk"
          SHA_NAME="PageClock-${VERSION_TAG}.apk.sha256"
          cp "$APK_DIR/app-release.apk" "$APK_DIR/$ASSET_NAME"
          cd "$APK_DIR"
          sha256sum "$ASSET_NAME" > "$SHA_NAME"
          echo "SHA256 Checksum:"
          cat "$SHA_NAME"

      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: pageclock-apk-build
          path: build/app/outputs/flutter-apk/PageClock-*.apk*
          if-no-files-found: error
          compression-level: 0

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ verify-and-web, android-apk ]
    runs-on: ubuntu-latest
    steps:
      - name: Download APK and checksum
        uses: actions/download-artifact@v4
        with:
          name: pageclock-apk-build
          path: artifacts/apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "PageClock Release ${{ github.ref_name }}"
          body: |
            ### PageClock Automated Release (${{ github.ref_name }})
            
            **What's Changed:**
            - Automated Android in-app updates with GitHub Releases.
            - SHA-256 integrity verification.
            - Drift SQLite offline-first persistence.
            - Mobile fullscreen clock and Pomodoro usability fixes.
            
            **Verification:**
            Download the matching `.sha256` file to verify the APK.
          draft: false
          prerelease: false
          files: |
            artifacts/apk/*.apk
            artifacts/apk/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
