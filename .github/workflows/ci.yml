name: PageClock CI / Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate clean platform scaffolds
        run: |
          flutter create --org com.example --project-name pageclock --platforms android,web .

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation (Drift / build_runner)
        run: dart run build_runner build --delete-conflicting-outputs || true

      - name: Run Unit & Acceptance Tests
        run: flutter test

      - name: Build Web
        run: flutter build web --release

      - name: Build Android APK (Release)
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pageclock-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pageclock-web
          path: build/web/
