name: PageClock CI / CD & Automated Release

on:
  push:
    branches: [ main, master, 'release/*' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: pageclock-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-web:
    name: Analyze, test and build web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation (Drift / build_runner)
        run: dart run build_runner build

      - name: Analyze Dart code
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Run Flutter tests (retry transient dependency/network failures only)
        shell: bash
        run: |
          set -u
          log_file="$RUNNER_TEMP/flutter-test.log"
          for attempt in 1 2 3 4; do
            echo "Flutter test attempt $attempt/4"
            if flutter test --no-pub >"$log_file" 2>&1; then
              cat "$log_file"
              exit 0
            else
              status=$?
              cat "$log_file"
            fi
            if grep -Eiq 'Received status code 5[0-9]{2}|HTTP/[0-9.]+ 5[0-9]{2}|HTTP response code: 5[0-9]{2}|Gateway Time[- ]out|Connection reset|Temporary failure|timed out|Building native assets failed|Building assets for package:sqlite3 failed|sqlite3.*(download|failed)' "$log_file"; then
              echo "Transient dependency/network failure detected; backing off before retry."
            else
              echo "Flutter tests failed for a non-transient reason; not retrying."
              exit "$status"
            fi
            if [ "$attempt" -lt 4 ]; then sleep $((attempt * 15)); fi
          done
          exit 1

      - name: Build Web Application
        run: flutter build web --release --no-web-resources-cdn --no-pub

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pageclock-web
          path: build/web/
          if-no-files-found: error
          compression-level: 1

  # Pull-request builds deliberately have no release signing credentials in their
  # job or step environment. The release variant falls back to Gradle debug
  # signing when no release keystore is present.
  android-pr-build:
    if: github.event_name == 'pull_request'
    name: Build Android PR APK (debug signing only)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17 (with Gradle dependency cache)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation (Drift / build_runner)
        run: dart run build_runner build

      - name: Build Android PR APK without release credentials
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_VERSION="$(sed -n 's/^version: *//p' pubspec.yaml | head -n 1)"
          VERSION_NAME="${SOURCE_VERSION%%+*}"
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+([.][0-9]+){2}$ ]]; then
            echo "::error::pubspec.yaml must provide a stable semantic version (for example 1.0.1)."
            exit 1
          fi
          flutter build apk --debug --target-platform=android-arm64 --build-name="$VERSION_NAME" --build-number="$BUILD_NUMBER" --android-skip-build-dependency-validation --no-pub

      - name: Upload Android PR APK
        uses: actions/upload-artifact@v4
        with:
          name: pageclock-android-pr
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          compression-level: 0

  # Production signing secrets are available only to trusted push/tag refs.
  android-apk:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v'))
    name: Build Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17 (with Gradle dependency cache)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation (Drift / build_runner)
        run: dart run build_runner build

      - name: Setup Android Keystore (required for release refs)
        id: setup_keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            chmod 600 android/app/release.keystore
          elif [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_REF" == refs/heads/release/v* ]]; then
            echo "::error::Version-tag releases require ANDROID_KEYSTORE_BASE64."
            exit 1
          else
            echo "No release keystore configured; main-branch build uses Gradle debug signing."
          fi

      - name: Build Android Release APK (retry transient dependency/network failures only)
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -u
          log_file="$RUNNER_TEMP/android-build.log"
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            SOURCE_VERSION="$(sed -n 's/^version: *//p' pubspec.yaml | head -n 1)"
          else
            SOURCE_VERSION="${GITHUB_REF_NAME#release/}"
            SOURCE_VERSION="${SOURCE_VERSION#v}"
          fi
          VERSION_NAME="${SOURCE_VERSION%%+*}"
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+([.][0-9]+){2}$ ]]; then
            echo "::error::Build ref or pubspec.yaml must provide a stable semantic version (for example 1.0.1)."
            exit 1
          fi
          echo "Building PageClock $VERSION_NAME with monotonic Android versionCode $BUILD_NUMBER"
          for attempt in 1 2 3 4; do
            echo "Android APK build attempt $attempt/4"
            if flutter build apk --release --target-platform=android-arm64 --build-name="$VERSION_NAME" --build-number="$BUILD_NUMBER" --android-skip-build-dependency-validation --no-pub >"$log_file" 2>&1; then
              cat "$log_file"
              exit 0
            else
              status=$?
              cat "$log_file"
            fi
            if grep -Eiq 'Received status code 5[0-9]{2}|HTTP/[0-9.]+ 5[0-9]{2}|HTTP response code: 5[0-9]{2}|Gateway Time[- ]out|Connection reset|Temporary failure|timed out|Building native assets failed|Building assets for package:sqlite3 failed|sqlite3.*(download|failed)' "$log_file"; then
              echo "Transient dependency/network failure detected; backing off before retry."
            else
              echo "Android build failed for a non-transient reason; not retrying."
              exit "$status"
            fi
            if [ "$attempt" -lt 4 ]; then sleep $((attempt * 15)); fi
          done
          exit 1

      - name: Secure Keystore Cleanup
        if: always()
        run: |
          rm -f android/app/release.keystore
          rm -f android/key.properties

      - name: Package Release Assets & Compute Checksum
        run: |
          APK_DIR="build/app/outputs/flutter-apk"
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            SOURCE_VERSION="$(sed -n 's/^version: *//p' pubspec.yaml | head -n 1)"
          else
            SOURCE_VERSION="${GITHUB_REF_NAME#release/}"
            SOURCE_VERSION="${SOURCE_VERSION#v}"
          fi
          VERSION_NAME="${SOURCE_VERSION%%+*}"
          VERSION_TAG="v${VERSION_NAME}+${GITHUB_RUN_NUMBER}"
          ASSET_NAME="PageClock-${VERSION_TAG}.apk"
          SHA_NAME="PageClock-${VERSION_TAG}.apk.sha256"
          cp "$APK_DIR/app-release.apk" "$APK_DIR/$ASSET_NAME"
          cd "$APK_DIR"
          sha256sum "$ASSET_NAME" > "$SHA_NAME"
          echo "SHA256 Checksum:"
          cat "$SHA_NAME"

      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: pageclock-apk-build
          path: build/app/outputs/flutter-apk/PageClock-*.apk*
          if-no-files-found: error
          compression-level: 0

  ios-simulator:
    name: Build iOS Simulator App
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
          pub-cache: true

      # Generate the native Xcode host project with a production-owned bundle
      # identifier. This repo keeps Flutter source canonical; the generated
      # Runner project is packaged as a build artifact for signing/release work.
      - name: Generate iOS host project
        run: flutter create --platforms=ios,macos --org com.pageclock --project-name app .

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation (Drift / build_runner)
        run: dart run build_runner build

      # Run the complete regression and pressure suite on macOS as well as Linux.
      # This catches platform-dependent plugin, file-system and timing issues.
      - name: Run Flutter regression and pressure tests on macOS
        run: flutter test --no-pub

      - name: Build unsigned iOS Simulator app (release configuration)
        run: flutter build ios --simulator --no-codesign --release --no-pub

      - name: Package generated iOS project and simulator app
        run: |
          ditto -c -k --sequesterRsrc --keepParent ios "$RUNNER_TEMP/pageclock-ios-project.zip"
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app "$RUNNER_TEMP/pageclock-ios-simulator-app.zip"

      - name: Upload iOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pageclock-ios-simulator
          path: |
            ${{ runner.temp }}/pageclock-ios-project.zip
            ${{ runner.temp }}/pageclock-ios-simulator-app.zip
          if-no-files-found: error
          compression-level: 1

  macos-desktop:
    name: Build macOS Desktop App
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
          pub-cache: true

      - name: Generate macOS host project
        run: flutter create --platforms=macos --org com.example --project-name pageclock .

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation (Drift / build_runner)
        run: dart run build_runner build

      - name: Build unsigned macOS desktop app
        run: flutter build macos --debug --no-pub

      - name: Package macOS app
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Debug/pageclock.app "$RUNNER_TEMP/pageclock-macos-debug-app.zip"

      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pageclock-macos-desktop
          path: ${{ runner.temp }}/pageclock-macos-debug-app.zip
          if-no-files-found: error
          compression-level: 1

  publish-release:
    name: Publish GitHub Release
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')
    needs: [ verify-and-web, android-apk ]
    runs-on: ubuntu-latest
    steps:
      - name: Download APK and checksum
        uses: actions/download-artifact@v4
        with:
          name: pageclock-apk-build
          path: artifacts/apk

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          SOURCE_VERSION="${GITHUB_REF_NAME#release/}"
          SOURCE_VERSION="${SOURCE_VERSION#v}"
          VERSION_NAME="${SOURCE_VERSION%%+*}"
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+(\.[0-9]+){2}$ ]]; then
            echo "::error::Release ref must contain a stable semantic version (for example v1.0.1)."
            exit 1
          fi
          RELEASE_TAG="v${VERSION_NAME}+${GITHUB_RUN_NUMBER}"
          echo "tag_name=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag_name }}
          name: "PageClock Release ${{ steps.release_tag.outputs.tag_name }}"
          body: |
            ### PageClock Automated Release (${{ steps.release_tag.outputs.tag_name }})
            
            **What's Changed:**
            - Automated Android in-app updates with GitHub Releases.
            - SHA-256 integrity verification.
            - Drift SQLite offline-first persistence.
            - Mobile fullscreen clock and Pomodoro usability fixes.
            - Eleven curated themes with coordinated light/dark palettes and instant previews.
            
            **Verification:**
            Download the matching `.sha256` file to verify the APK.
          draft: false
          prerelease: false
          files: |
            artifacts/apk/*.apk
            artifacts/apk/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
