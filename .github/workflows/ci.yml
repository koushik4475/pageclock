name: PageClock CI / CD & Automated Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation (Drift / build_runner)
        run: dart run build_runner build

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

      - name: Build Web Application
        run: flutter build web --release --no-web-resources-cdn

      - name: Setup Android Keystore (if secrets provided)
        id: setup_keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "Decoding Android release keystore from GitHub Secrets..."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            chmod 600 android/app/release.keystore
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Version-tag releases require ANDROID_KEYSTORE_BASE64."
            exit 1
          else
            echo "No release keystore configured; non-release builds will use the Gradle debug signing fallback."
          fi

      - name: Build Android Release APK
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ env.ANDROID_KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ env.ANDROID_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ env.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --target-platform=android-arm64 --build-number=${{ github.run_number }} --android-skip-build-dependency-validation

      - name: Secure Keystore Cleanup
        if: always()
        run: |
          rm -f android/app/release.keystore
          rm -f android/key.properties

      - name: Package Release Assets & Compute Checksum
        run: |
          APK_DIR="build/app/outputs/flutter-apk"
          VERSION_TAG="v1.0.0+${{ github.run_number }}"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION_TAG="${{ github.ref_name }}"
          fi

          ASSET_NAME="PageClock-${VERSION_TAG}.apk"
          SHA_NAME="PageClock-${VERSION_TAG}.apk.sha256"

          cp "$APK_DIR/app-release.apk" "$APK_DIR/$ASSET_NAME"
          
          cd "$APK_DIR"
          sha256sum "$ASSET_NAME" > "$SHA_NAME"
          
          echo "SHA256 Checksum:"
          cat "$SHA_NAME"
          
          echo "RELEASE_TAG=$VERSION_TAG" >> $GITHUB_ENV
          echo "APK_PATH=$APK_DIR/$ASSET_NAME" >> $GITHUB_ENV
          echo "SHA_PATH=$APK_DIR/$SHA_NAME" >> $GITHUB_ENV

      - name: Upload Local CI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pageclock-apk-build
          path: build/app/outputs/flutter-apk/*.apk

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pageclock-web
          path: build/web/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "PageClock Release ${{ env.RELEASE_TAG }}"
          body: |
            ### PageClock Automated Release (${{ env.RELEASE_TAG }})
            
            **What's Changed:**
            - Automated Android In-App Updates with GitHub Releases.
            - SHA-256 integrity verification.
            - Drift SQLite offline-first persistence.
            - Linear-inspired Bento-Grid interface with StandBy mode.
            
            **Verification:**
            Download `PageClock-*.apk.sha256` or run:
            ```bash
            sha256sum -c ${{ env.RELEASE_TAG }}.apk.sha256
            ```
          draft: false
          prerelease: false
          files: |
            ${{ env.APK_PATH }}
            ${{ env.SHA_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
