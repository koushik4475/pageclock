name: PageClock CI / CD & Automated Release

on:
  push:
    branches: [ main, master, 'release/*' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: pageclock-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-web:
    name: Analyze, test and build web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation (Drift / build_runner)
        run: dart run build_runner build

      - name: Analyze Dart code
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Run Flutter tests (retry transient dependency/network failures only)
        shell: bash
        run: |
          set -u
          log_file="$RUNNER_TEMP/flutter-test.log"
          for attempt in 1 2 3 4; do
            echo "Flutter test attempt $attempt/4"
            if flutter test --no-pub >"$log_file" 2>&1; then
              cat "$log_file"
              exit 0
            else
              status=$?
              cat "$log_file"
            fi
            if grep -Eiq 'Received status code 5[0-9]{2}|HTTP/[0-9.]+ 5[0-9]{2}|HTTP response code: 5[0-9]{2}|Gateway Time[- ]out|Connection reset|Temporary failure|timed out|Building native assets failed|Building assets for package:sqlite3 failed|sqlite3.*(download|failed)' "$log_file"; then
              echo "Transient dependency/network failure detected; backing off before retry."
            else
              echo "Flutter tests failed for a non-transient reason; not retrying."
              exit "$status"
            fi
            if [ "$attempt" -lt 4 ]; then sleep $((attempt * 15)); fi
          done
          exit 1

      - name: Build Web Application
        run: flutter build web --release --no-web-resources-cdn --no-pub

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pageclock-web
          path: build/web/
          if-no-files-found: error
          compression-level: 1


  # Compile Android on pull requests without exposing production signing secrets.
  # This job uses Gradle's debug signing only and never publishes or uploads an APK.
  android-pr-build:
    if: github.event_name == 'pull_request'
    name: Compile Android PR (debug signing only)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Java 17 (with Gradle dependency cache)
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation (Drift / build_runner)
        run: dart run build_runner build

      - name: Build Android debug APK without release credentials
        run: flutter build apk --debug --target-platform=android-arm64 --no-pub

  android-apk:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    name: Build Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Java 17 (with Gradle dependency cache)
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation (Drift / build_runner)
        run: dart run build_runner build

      - name: Setup Android Keystore (if secrets provided)
        id: setup_keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            chmod 600 android/app/release.keystore
          elif [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_REF" == refs/heads/release/v* ]]; then
            echo "::error::Version-tag releases require ANDROID_KEYSTORE_BASE64."
            exit 1
          else
            echo "No release keystore configured; non-release builds use Gradle debug signing."
          fi

      - name: Build Android Release APK (retry transient dependency/network failures only)
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -u
          log_file="$RUNNER_TEMP/android-build.log"
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            SOURCE_VERSION="$(sed -n 's/^version: *//p' pubspec.yaml | head -n 1)"
          else
            SOURCE_VERSION="${GITHUB_REF_NAME#release/}"
            SOURCE_VERSION="${SOURCE_VERSION#v}"
          fi
          VERSION_NAME="${SOURCE_VERSION%%+*}"
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+(\.[0-9]+){2}$ ]]; then
            echo "::error::Build ref or pubspec.yaml must provide a stable semantic version (for example 1.0.1)."
            exit 1
          fi
          echo "Building PageClock $VERSION_NAME with monotonic Android versionCode $BUILD_NUMBER"
          for attempt in 1 2 3 4; do
            echo "Android APK build attempt $attempt/4"
            if flutter build apk --release --target-platform=android-arm64 --build-name="$VERSION_NAME" --build-number="$BUILD_NUMBER"  --no-pub >"$log_file" 2>&1; then
              cat "$log_file"
              exit 0
            else
              status=$?
              cat "$log_file"
            fi
            if grep -Eiq 'Received status code 5[0-9]{2}|HTTP/[0-9.]+ 5[0-9]{2}|HTTP response code: 5[0-9]{2}|Gateway Time[- ]out|Connection reset|Temporary failure|timed out|Building native assets failed|Building assets for package:sqlite3 failed|sqlite3.*(download|failed)' "$log_file"; then
              echo "Transient dependency/network failure detected; backing off before retry."
            else
              echo "Android build failed for a non-transient reason; not retrying."
              exit "$status"
            fi
            if [ "$attempt" -lt 4 ]; then sleep $((attempt * 15)); fi
          done
          exit 1

      - name: Secure Keystore Cleanup
        if: always()
        run: |
          rm -f android/app/release.keystore
          rm -f android/key.properties

      - name: Package Release Assets & Compute Checksum
        run: |
          APK_DIR="build/app/outputs/flutter-apk"
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            SOURCE_VERSION="$(sed -n 's/^version: *//p' pubspec.yaml | head -n 1)"
          else
            SOURCE_VERSION="${GITHUB_REF_NAME#release/}"
            SOURCE_VERSION="${SOURCE_VERSION#v}"
          fi
          VERSION_NAME="${SOURCE_VERSION%%+*}"
          VERSION_TAG="v${VERSION_NAME}+${GITHUB_RUN_NUMBER}"
          ASSET_NAME="PageClock-${VERSION_TAG}.apk"
          SHA_NAME="PageClock-${VERSION_TAG}.apk.sha256"
          cp "$APK_DIR/app-release.apk" "$APK_DIR/$ASSET_NAME"
          cd "$APK_DIR"
          sha256sum "$ASSET_NAME" > "$SHA_NAME"
          echo "SHA256 Checksum:"
          cat "$SHA_NAME"

      - name: Upload APK and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pageclock-apk-build
          path: build/app/outputs/flutter-apk/PageClock-*.apk*
          if-no-files-found: error
          compression-level: 0

  publish-release:
    name: Publish GitHub Release
    permissions:
      contents: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [ verify-and-web, android-apk ]
    runs-on: ubuntu-latest
    steps:
      - name: Download APK and checksum
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pageclock-apk-build
          path: artifacts/apk

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          SOURCE_VERSION="${GITHUB_REF_NAME#release/}"
          SOURCE_VERSION="${SOURCE_VERSION#v}"
          VERSION_NAME="${SOURCE_VERSION%%+*}"
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+(\.[0-9]+){2}$ ]]; then
            echo "::error::Release ref must contain a stable semantic version (for example v1.0.1)."
            exit 1
          fi
          RELEASE_TAG="v${VERSION_NAME}+${GITHUB_RUN_NUMBER}"
          echo "tag_name=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.release_tag.outputs.tag_name }}
          name: "PageClock Release ${{ steps.release_tag.outputs.tag_name }}"
          body: |
            ### PageClock ${{ steps.release_tag.outputs.tag_name }}

            **What's changed:**
            - Pomodoro break countdown now uses a UTC deadline, avoiding accumulated drift when timer callbacks are delayed.
            - Statistics calculations safely handle empty and negative time windows.
            - Existing offline-first SQLite persistence, reading reports, themes, and Android in-app update verification are retained.

            **Integrity:**
            Download the matching `.sha256` file and verify the APK before installing.
          draft: false
          prerelease: false
          files: |
            artifacts/apk/*.apk
            artifacts/apk/*.sha256
