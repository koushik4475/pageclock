# Supabase local and project configuration for PageClock

project_id = "pageclock"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[auth]
enabled = true

[functions.delete-account]
verify_jwt = true

[functions.admin-analytics]
verify_jwt = true
