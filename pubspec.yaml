name: pageclock
description: "A fast, offline-first reading focus tracker with Drift and Riverpod."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  fl_chart: ^0.69.0
  intl: ^0.19.0
  uuid: ^4.5.1
  csv: ^6.0.0
  share_plus: ^10.0.2
  cross_file: ^0.3.4+2
  pdf: ^3.11.1
  printing: ^5.13.2
  # printing pulls image transitively; 4.11.1 fixes its archive API requirement.
  image: 4.11.1
  http: ^1.2.2
  package_info_plus: ^8.1.0
  open_filex: ^4.5.0
  crypto: ^3.0.5
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  supabase_flutter: ^2.10.3
  file_picker: ^8.1.4
  wakelock_plus: ^1.2.8
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.12
  mocktail: ^1.0.4

dependency_overrides:
  # pdf 3.12 still caps archive below 4.1; image 4.11.1 needs decodeLazy from 4.4+.
  archive: 4.4.0

flutter:
  uses-material-design: true
